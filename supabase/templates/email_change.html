<!doctype html>
<html lang="en">
  <body style="margin:0;">
    <div style="padding:32px 16px;background:#09090b;color:#fafafa;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;">
      <div style="max-width:480px;margin:0 auto;">
        <p style="margin:0 0 24px;font-size:17px;font-weight:600;">Klyvi</p>
        <h1 style="margin:0 0 12px;font-size:21px;font-weight:600;">Confirm your new email</h1>
        <p style="margin:0 0 24px;">Open this link to change your Klyvi email from {{ .Email }} to {{ .NewEmail }}.</p>
        <p style="margin:0 0 24px;">
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next=/settings" style="display:inline-block;padding:10px 18px;background:#5b21b6;color:#ffffff;border-radius:8px;font-weight:600;text-decoration:none;">Confirm the change</a>
        </p>
        <p style="margin:0;color:#a1a1aa;font-size:13px;">The link works once and expires in an hour. If you did not ask for this, ignore this email and write to hello@klyvi.net.</p>
      </div>
    </div>
  </body>
</html>
