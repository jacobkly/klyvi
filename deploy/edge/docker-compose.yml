# Shared edge stack: one Cloudflare tunnel + one auto-updater for the whole
# server, reused by every app and kept separate so app deploys never touch
# ingress. Create the shared network first: `docker network create edge`.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Both images are pinned so a server restart never pulls a surprise release.
  # Dependabot opens a monthly PR when a newer tag ships.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    # Routes live in the Cloudflare dashboard, each pointing at a service on the
    # edge network, e.g. http://klyvi-api:8080.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    logging: *logging
    networks:
      - edge

  watchtower:
    # 1.7.1 is the last release. The project is no longer maintained.
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Watchtower defaults to Docker API 1.25, which Docker 29 refuses ("client
    # version 1.25 is too old"), so it exits and nothing deploys. Ask for a
    # version Docker 29 accepts.
    environment:
      DOCKER_API_VERSION: "1.44"
    # Watches every labelled container on the host — one instance covers all apps.
    command: --interval 60 --label-enable --cleanup
    logging: *logging

networks:
  edge:
    external: true
